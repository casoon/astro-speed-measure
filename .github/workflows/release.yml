name: Release

# Tag `vX.Y.Z` → build the package, then publish `@casoon/astro-speed-measure`
# to npm with Trusted Publishing (provenance, no stored token) after approval
# in the `npm` environment. The tag must match `package.json`.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci

      - name: Tag matches the package version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"

      - run: npm run build

  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Update npm (Trusted Publishing needs >= 11.5)
        run: npm install -g npm@latest

      - run: npm ci

      # `prepublishOnly` builds `dist/`.
      - name: Publish
        run: npm publish --access public
